<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Clash</title>
    <link rel="shortcut icon" href="images/play.png" type="image/x-icon">
    <!-- DaisyUI & TailwindCSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="Styles/style.css">

</head>
<body>
    <main class="min-h-screen bg-[#1E1E1E] bg-[url('images/background.png')] bg-no-repeat bg-center">
        <!-- Home -->
        <section id="home-screen" class="">
            <div class="min-h-screen flex justify-center items-center">
                <div class="text-white flex flex-col items-center gap-10">
                    <h1 class="text-9xl font-anton font-normal">ALPHABET CLASH</h1>
                    <p class="text-xl font-poppins">Unleash Your Keyboard Kung Fu : Click “Play Now” to Play</p>
                    <button onclick="playNow()" class="btn shadow-none border-none text-xl font-poppins font-bold text-black">Play Now</button>
                </div>
            </div>
        </section>

        <!-- Playground -->
        <section id="playground-screen" class="hidden font-poppins">
            <div class="flex flex-col items-center space-y-20">
                <!-- Screen -->
                <div class="flex flex-col items-center">
                    <div class="w-[900px] h-[400px] mt-16 bg-[#FFFFFF80] border-[15px] border-[#27272a] rounded-xl">
                        <div class="flex justify-center text-white -mt-3">
                            <p class="font-bold bg-[#27272a] p-2 px-5 rounded-b-xl">Don't watch keyboard  while playing...</p>
                        </div>
                        <div class="flex justify-center items-center h-3/4">
                            <p id="display-alphabet" class="text-[250px] font-bold"></p>
                        </div>
                    </div>
                </div>
                <!-- Keyboard -->
                <div class="">
                    <div class="my-1 flex w-full justify-center gap-1 space-x-1 space-y-1">
                        <kbd id="q" class="kbd kbd-xl text-2xl">q</kbd>
                        <kbd id="w" class="kbd kbd-xl text-2xl">w</kbd>
                        <kbd id="e" class="kbd kbd-xl text-2xl">e</kbd>
                        <kbd id="r" class="kbd kbd-xl text-2xl">r</kbd>
                        <kbd id="t" class="kbd kbd-xl text-2xl">t</kbd>
                        <kbd id="y" class="kbd kbd-xl text-2xl">y</kbd>
                        <kbd id="u" class="kbd kbd-xl text-2xl">u</kbd>
                        <kbd id="i" class="kbd kbd-xl text-2xl">i</kbd>
                        <kbd id="o" class="kbd kbd-xl text-2xl">o</kbd>
                        <kbd id="p" class="kbd kbd-xl text-2xl">p</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1 space-x-1 space-y-1">
                        <kbd id="a" class="kbd kbd-xl text-2xl">a</kbd>
                        <kbd id="s" class="kbd kbd-xl text-2xl">s</kbd>
                        <kbd id="d" class="kbd kbd-xl text-2xl">d</kbd>
                        <kbd id="f" class="kbd kbd-xl text-2xl">f</kbd>
                        <kbd id="g" class="kbd kbd-xl text-2xl">g</kbd>
                        <kbd id="h" class="kbd kbd-xl text-2xl">h</kbd>
                        <kbd id="j" class="kbd kbd-xl text-2xl">j</kbd>
                        <kbd id="k" class="kbd kbd-xl text-2xl">k</kbd>
                        <kbd id="l" class="kbd kbd-xl text-2xl">l</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1 space-x-1 space-y-1">
                        <kbd id="z" class="kbd kbd-xl text-2xl">z</kbd>
                        <kbd id="x" class="kbd kbd-xl text-2xl">x</kbd>
                        <kbd id="c" class="kbd kbd-xl text-2xl">c</kbd>
                        <kbd id="v" class="kbd kbd-xl text-2xl">v</kbd>
                        <kbd id="b" class="kbd kbd-xl text-2xl">b</kbd>
                        <kbd id="n" class="kbd kbd-xl text-2xl">n</kbd>
                        <kbd id="m" class="kbd kbd-xl text-2xl">m</kbd>
                    </div>
                </div>
                <!-- Button -->
                <div class="flex justify-between w-[1000px]">
                    <!-- Life Button -->
                    <div>
                        <button class="btn btn-neutral border-0 shadow-none flex items-center bg-purple-700 rounded-full">
                            <p class="text-xl text-white font-bold">Life</p>
                            <img src="images/life.png" alt="">
                            <p id="current-life" class="text-xl text-white font-bold">3</p>
                        </button>
                    </div>
                    <!-- Score Button -->
                    <div>
                        <button class="btn btn-neutral border-0 shadow-none flex items-center bg-purple-700 rounded-full">
                            <p class="text-xl text-white font-bold">Score</p>
                            <img src="images/score.png" alt="">
                            <p id="current-score" class="text-xl text-white font-bold">0</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Score -->
        <section id="score-screen" class="hidden font-poppins">
            <div class="flex items-center justify-center min-h-screen">
                <div class="text-center space-y-5 bg-[#FFFFFF33] p-10 rounded-lg">
                    <h1 class="text-6xl font-bold text-white">GAME OVER!!!</h1>
                    <h1 class="text-5xl font-extrabold text-white">Score:
                    <span id="last-score"></span>
                    </h1>
                    <button onclick="playAgain()" id="play-again" class="btn btn-neutral shadow-none border-none bg-white text-black text-xl font-bold">Play
                        Again</button>
                    <p class="text-white text-lg font-semibold">Practice will make you Pro</p>
                </div>
            </div>
        </section>

        <!-- JavaScript File -->
        <script src="JS/script.js"></script>
        <script src="JS/utility.js"></script>
    </main>
</body>
</html>
